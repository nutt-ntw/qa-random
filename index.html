```html
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>โปรแกรมสุ่มจับฉลาก</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Noto Sans Thai", sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            max-width: 950px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin: 0 0 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .label-info {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .label-item {
            padding: 10px 16px;
            border-radius: 10px;
            background: #eef1f5;
            font-weight: bold;
        }

        .settings {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .setting {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .setting label {
            font-weight: bold;
        }

        input {
            width: 100px;
            padding: 11px;
            font-size: 18px;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 10px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        button {
            border: none;
            padding: 13px 25px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .draw-btn {
            background: #2563eb;
            color: white;
        }

        .draw-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }

        .reset-btn {
            background: #e5e7eb;
            color: #222;
        }

        .status {
            text-align: center;
            margin: 20px 0;
            font-size: 17px;
        }

        .status span {
            font-weight: bold;
        }

        .result-box {
            min-height: 220px;
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            margin-bottom: 30px;
        }

        .result-title {
            color: #666;
            margin-bottom: 25px;
            font-size: 18px;
        }

        .results {
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        .result-number {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: white;
            border: 5px solid #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: bold;
            animation: pop 0.4s ease;
        }

        @keyframes pop {

            0% {
                transform: scale(0);
                opacity: 0;
            }

            70% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }

        }

        .history-title {
            margin-bottom: 10px;
        }

        .history {
            background: #f8fafc;
            border-radius: 12px;
            padding: 15px;
            max-height: 350px;
            overflow-y: auto;
        }

        .history-item {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .empty {
            color: #999;
            text-align: center;
        }

        .message {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }

        @media (max-width: 600px) {

            .container {
                margin: 10px auto;
                padding: 10px;
            }

            .card {
                padding: 20px;
            }

            .result-number {
                width: 70px;
                height: 70px;
                font-size: 30px;
            }

        }

    </style>
</head>


<body>

<div class="container">

    <div class="card">

        <h1>🎟️ โปรแกรมสุ่มจับฉลาก</h1>

        <div class="subtitle">
            ทุกครั้งที่สุ่ม ระบบจะ Reset ฉลากใหม่อัตโนมัติ
        </div>


        <!-- จำนวนฉลาก -->

        <div class="label-info">

            <div class="label-item">
                เลข 1 × 5
            </div>

            <div class="label-item">
                เลข 2 × 3
            </div>

            <div class="label-item">
                เลข 3 × 1
            </div>

            <div class="label-item">
                เลข 4 × 3
            </div>

            <div class="label-item">
                เลข 5 × 5
            </div>

        </div>


        <!-- Settings -->

        <div class="settings">

            <div class="setting">

                <label>
                    จำนวนครั้งที่สุ่ม:
                </label>

                <input
                    type="number"
                    id="totalDraws"
                    min="1"
                    value="5"
                >

            </div>


            <div class="setting">

                <label>
                    จำนวนใบต่อครั้ง:
                </label>

                <input
                    type="number"
                    id="drawCount"
                    min="1"
                    max="17"
                    value="3"
                >

            </div>

        </div>


        <!-- Buttons -->

        <div class="buttons">

            <button
                class="draw-btn"
                id="drawButton"
                onclick="startDrawing()"
            >
                🎲 เริ่มสุ่ม
            </button>


            <button
                class="reset-btn"
                onclick="resetGame()"
            >
                🔄 Reset
            </button>

        </div>


        <!-- Status -->

        <div class="status">

            สุ่มไปแล้ว:
            <span id="currentDraw">
                0
            </span>

            /

            <span id="totalDrawDisplay">
                5
            </span>

            ครั้ง

        </div>


        <!-- Result -->

        <div class="result-box">

            <div class="result-title">

                ผลการสุ่มครั้งล่าสุด

            </div>


            <div
                class="results"
                id="results"
            >

                <div class="empty">

                    กดปุ่ม "เริ่มสุ่ม"

                </div>

            </div>

        </div>


        <!-- History -->

        <h3 class="history-title">

            📋 ประวัติการสุ่ม

        </h3>


        <div
            class="history"
            id="history"
        >

            <div class="empty">

                ยังไม่มีประวัติ

            </div>

        </div>


        <div
            class="message"
            id="message"
        ></div>

    </div>

</div>



<script>


/*
==================================================
จำนวนฉลากต้นฉบับ
==================================================

1 = 5 ใบ
2 = 3 ใบ
3 = 1 ใบ
4 = 3 ใบ
5 = 5 ใบ

รวม 17 ใบ
==================================================
*/

const originalLabels = [

    1, 1, 1, 1, 1,

    2, 2, 2,

    3,

    4, 4, 4,

    5, 5, 5, 5, 5

];



/*
==================================================
ตัวแปรระบบ
==================================================
*/

let currentDraw = 0;

let totalDraws = 0;

let drawCount = 0;

let isRunning = false;



/*
==================================================
เริ่มการสุ่ม
==================================================
*/

function startDrawing() {

    if (isRunning) {
        return;
    }


    totalDraws =
        parseInt(
            document.getElementById("totalDraws").value
        );


    drawCount =
        parseInt(
            document.getElementById("drawCount").value
        );


    /*
        ตรวจสอบจำนวนครั้ง
    */

    if (
        isNaN(totalDraws) ||
        totalDraws < 1
    ) {

        alert(
            "กรุณาระบุจำนวนครั้งที่ต้องการสุ่ม"
        );

        return;

    }


    /*
        ตรวจสอบจำนวนใบ
    */

    if (
        isNaN(drawCount) ||
        drawCount < 1 ||
        drawCount > 17
    ) {

        alert(
            "จำนวนใบต่อครั้งต้องอยู่ระหว่าง 1 - 17 ใบ"
        );

        return;

    }


    /*
        Reset ตัวนับ
    */

    currentDraw = 0;

    isRunning = true;


    /*
        Disable ปุ่ม
    */

    document.getElementById("drawButton")
        .disabled = true;


    /*
        แสดงจำนวนครั้ง
    */

    document.getElementById("totalDrawDisplay")
        .innerText = totalDraws;


    /*
        เริ่มสุ่ม
    */

    drawNext();

}



/*
==================================================
สุ่มครั้งถัดไป
==================================================
*/

function drawNext() {

    /*
        ถ้าสุ่มครบแล้ว
    */

    if (currentDraw >= totalDraws) {

        finishDrawing();

        return;

    }


    /*
        เพิ่มจำนวนครั้ง
    */

    currentDraw++;


    document.getElementById("currentDraw")
        .innerText = currentDraw;


    /*
        สำคัญมาก

        ทุกครั้งที่เริ่มสุ่ม
        จะสร้างฉลากใหม่จาก originalLabels

        ดังนั้นแต่ละรอบจะเป็นอิสระจากกัน
    */

    let availableLabels =
        [...originalLabels];


    /*
        Array สำหรับเก็บผลครั้งนี้
    */

    let selected = [];


    /*
        สุ่มตามจำนวนใบที่กำหนด
    */

    for (
        let i = 0;
        i < drawCount;
        i++
    ) {


        /*
            สุ่มตำแหน่ง
            จากใบที่ยังไม่ได้หยิบ
        */

        const randomIndex =
            Math.floor(
                Math.random() *
                availableLabels.length
            );


        /*
            หยิบใบออกจาก array

            splice ทำให้ใบนี้
            ไม่สามารถถูกหยิบซ้ำ
            ในรอบเดียวกันได้
        */

        const picked =
            availableLabels.splice(
                randomIndex,
                1
            )[0];


        selected.push(picked);

    }


    /*
        แสดงผล
    */

    showResults(selected);


    /*
        บันทึกประวัติ
    */

    addHistory(
        currentDraw,
        selected
    );


    /*
        ถ้ายังไม่ครบจำนวนครั้ง
        ให้รอ 1 วินาทีแล้วสุ่มใหม่
    */

    if (currentDraw < totalDraws) {

        setTimeout(
            drawNext,
            1000
        );

    } else {

        finishDrawing();

    }

}



/*
==================================================
แสดงผลการสุ่ม
==================================================
*/

function showResults(selected) {

    const results =
        document.getElementById("results");


    results.innerHTML = "";


    selected.forEach(
        number => {

            const div =
                document.createElement("div");


            div.className =
                "result-number";


            div.innerText =
                number;


            results.appendChild(div);

        }
    );

}



/*
==================================================
เพิ่มประวัติ
==================================================
*/

function addHistory(
    drawNumber,
    selected
) {

    const history =
        document.getElementById("history");


    /*
        ลบข้อความ
        "ยังไม่มีประวัติ"
    */

    if (
        history.querySelector(".empty")
    ) {

        history.innerHTML = "";

    }


    const item =
        document.createElement("div");


    item.className =
        "history-item";


    item.innerHTML =

        `<strong>
            ครั้งที่ ${drawNumber}
        </strong>

        → หยิบ ${selected.length} ใบ

        → <strong>
            ${selected.join(", ")}
        </strong>`;


    history.prepend(item);

}



/*
==================================================
สุ่มครบตามจำนวน
==================================================
*/

function finishDrawing() {

    isRunning = false;


    document.getElementById("drawButton")
        .disabled = false;


    document.getElementById("message")
        .innerText =

        `🎉 สุ่มครบ ${totalDraws} ครั้งแล้ว`;

}



/*
==================================================
Reset
==================================================
*/

function resetGame() {

    /*
        หยุดการสุ่ม
    */

    isRunning = false;


    currentDraw = 0;


    /*
        เปิดปุ่ม
    */

    document.getElementById("drawButton")
        .disabled = false;


    /*
        Reset counter
    */

    document.getElementById("currentDraw")
        .innerText = "0";


    /*
        ล้างผลล่าสุด
    */

    document.getElementById("results")
        .innerHTML =

        `<div class="empty">

            กดปุ่ม "เริ่มสุ่ม"

        </div>`;


    /*
        ล้างประวัติ
    */

    document.getElementById("history")
        .innerHTML =

        `<div class="empty">

            ยังไม่มีประวัติ

        </div>`;


    /*
        ล้างข้อความ
    */

    document.getElementById("message")
        .innerText = "";

}


</script>

</body>
</html>
```
