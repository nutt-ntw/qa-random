<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>โปรแกรมสุ่มจับฉลาก</title>

    <!-- SheetJS สำหรับ Export Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Noto Sans Thai", sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin: 0 0 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        /* ฉลาก */

        .label-info {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .label-item {
            padding: 10px 16px;
            border-radius: 10px;
            background: #eef1f5;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .label-count-input {
            width: 70px;
            padding: 8px;
            font-size: 16px;
        }

        .label-total {
            text-align: center;
            color: #666;
            font-weight: bold;
            margin: -18px 0 30px;
        }

        /* Settings */

        .settings {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .setting {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .setting label {
            font-weight: bold;
        }

        input {
            width: 100px;
            padding: 11px;
            font-size: 18px;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 10px;
        }

        /* Buttons */

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        button {
            border: none;
            padding: 13px 25px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:disabled {
            background: #9ca3af !important;
            cursor: not-allowed;
            transform: none;
        }

        .draw-btn {
            background: #2563eb;
            color: white;
        }

        .reset-btn {
            background: #e5e7eb;
            color: #222;
        }

        .csv-btn {
            background: #16a34a;
            color: white;
        }

        .excel-btn {
            background: #15803d;
            color: white;
        }

        .copy-btn {
            background: #7c3aed;
            color: white;
        }

        /* Status */

        .status {
            text-align: center;
            margin: 20px 0;
            font-size: 17px;
        }

        .status span {
            font-weight: bold;
        }

        /* Result */

        .result-box {
            min-height: 220px;
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            margin-bottom: 30px;
        }

        .result-title {
            color: #666;
            margin-bottom: 25px;
            font-size: 18px;
        }

        .results {
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        .result-number {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: white;
            border: 5px solid #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: bold;
            animation: pop 0.4s ease;
        }

        @keyframes pop {

            0% {
                transform: scale(0);
                opacity: 0;
            }

            70% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }

        }

        /* History */

        .history-section {
            margin-top: 30px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }

        .history-header h3 {
            margin: 0;
        }

        .export-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .export-buttons button {
            padding: 10px 15px;
            font-size: 14px;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            background: #f8fafc;
            border-radius: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 500px;
        }

        th,
        td {
            padding: 12px 15px;
            text-align: center;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #e5e7eb;
            font-weight: bold;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .empty {
            color: #999;
            text-align: center;
            padding: 25px;
        }

        .message {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }

        /* Mobile */

        @media (max-width: 600px) {

            .container {
                margin: 10px auto;
                padding: 10px;
            }

            .card {
                padding: 20px;
            }

            .result-number {
                width: 70px;
                height: 70px;
                font-size: 30px;
            }

            .history-header {
                flex-direction: column;
                align-items: stretch;
            }

            .export-buttons {
                justify-content: center;
            }

        }

    </style>
</head>


<body>

<div class="container">

    <div class="card">

        <h1>🎟️ โปรแกรมสุ่มจับฉลาก</h1>

        <div class="subtitle">
            ทุกครั้งที่สุ่ม ระบบจะ Reset ฉลากใหม่อัตโนมัติ
        </div>


        <!-- จำนวนฉลาก -->

        <div class="label-info">

            <label class="label-item">
                เลข 1 ×
                <input class="label-count-input" type="number" min="0" step="1" value="5" data-number="1" oninput="updateTotalLabels()">
            </label>

            <label class="label-item">
                เลข 2 ×
                <input class="label-count-input" type="number" min="0" step="1" value="3" data-number="2" oninput="updateTotalLabels()">
            </label>

            <label class="label-item">
                เลข 3 ×
                <input class="label-count-input" type="number" min="0" step="1" value="1" data-number="3" oninput="updateTotalLabels()">
            </label>

            <label class="label-item">
                เลข 4 ×
                <input class="label-count-input" type="number" min="0" step="1" value="3" data-number="4" oninput="updateTotalLabels()">
            </label>

            <label class="label-item">
                เลข 5 ×
                <input class="label-count-input" type="number" min="0" step="1" value="5" data-number="5" oninput="updateTotalLabels()">
            </label>

        </div>

        <div class="label-total">
            รวม <span id="totalLabels">17</span> ใบ
        </div>


        <!-- Settings -->

        <div class="settings">

            <div class="setting">

                <label>
                    จำนวนครั้งที่สุ่ม:
                </label>

                <input
                    type="number"
                    id="totalDraws"
                    min="1"
                    value="5"
                >

            </div>


            <div class="setting">

                <label>
                    จำนวนใบต่อครั้ง:
                </label>

                <input
                    type="number"
                    id="drawCount"
                    min="1"
                    max="17"
                    value="17"
                >

            </div>

        </div>


        <!-- Buttons -->

        <div class="buttons">

            <button
                class="draw-btn"
                id="drawButton"
                onclick="startDrawing()"
            >
                🎲 เริ่มสุ่ม
            </button>


            <button
                class="reset-btn"
                onclick="resetGame()"
            >
                🔄 Reset
            </button>

        </div>


        <!-- Status -->

        <div class="status">

            สุ่มไปแล้ว:
            <span id="currentDraw">0</span>

            /

            <span id="totalDrawDisplay">5</span>

            ครั้ง

        </div>


        <!-- ผลการสุ่ม -->

        <div class="result-box">

            <div class="result-title">
                ผลการสุ่มครั้งล่าสุด
            </div>

            <div
                class="results"
                id="results"
            >

                <div class="empty">
                    กดปุ่ม "เริ่มสุ่ม"
                </div>

            </div>

        </div>


        <!-- ประวัติ -->

        <div class="history-section">

            <div class="history-header">

                <h3>
                    📋 ประวัติการสุ่ม
                </h3>


                <div class="export-buttons">

                    <button
                        class="copy-btn"
                        onclick="copyToExcel()"
                    >
                        📋 Copy สำหรับ Excel
                    </button>


                    <button
                        class="csv-btn"
                        onclick="exportCSV()"
                    >
                        📄 Export CSV
                    </button>


                    <button
                        class="excel-btn"
                        onclick="exportExcel()"
                    >
                        📊 Export Excel
                    </button>

                </div>

            </div>


            <div class="table-wrapper">

                <table id="historyTable">

                    <thead>
                        <tr id="tableHeader">
                            <th>ครั้งที่</th>
                            <th>ผลที่ 1</th>
                            <th>ผลที่ 2</th>
                            <th>ผลที่ 3</th>
                            <th>จำนวนใบ</th>
                        </tr>
                    </thead>

                    <tbody id="historyBody">

                    </tbody>

                </table>

            </div>

        </div>


        <div
            class="message"
            id="message"
        ></div>

    </div>

</div>



<script>


/* ฉลากสำหรับการสุ่มชุดปัจจุบัน */

let activeLabels = [];



/*
==================================================
ตัวแปร
==================================================
*/

let currentDraw = 0;

let totalDraws = 0;

let drawCount = 0;

let isRunning = false;


/*
เก็บประวัติทั้งหมด

ตัวอย่าง:

[
    {
        draw: 1,
        results: [1,5,2]
    },
    {
        draw: 2,
        results: [4,1,5]
    }
]
*/

let historyData = [];



/*
==================================================
อ่านและอัปเดตจำนวนฉลาก
==================================================
*/

function readLabelConfiguration() {

    return Array.from(
        document.querySelectorAll(".label-count-input")
    ).map(
        input => ({
            number: Number(input.dataset.number),
            count: Number(input.value)
        })
    );

}


function updateTotalLabels() {

    const total = readLabelConfiguration()
        .reduce(
            (sum, item) =>
                sum + (
                    Number.isInteger(item.count) &&
                    item.count >= 0
                        ? item.count
                        : 0
                ),
            0
        );


    document.getElementById("totalLabels")
        .innerText = total;


    const drawCountInput =
        document.getElementById("drawCount");

    drawCountInput.max = Math.max(total, 1);


    if (
        total > 0 &&
        Number(drawCountInput.value) > total
    ) {

        drawCountInput.value = total;

    }

}


function setConfigurationDisabled(disabled) {

    document.querySelectorAll(
        ".label-count-input, #totalDraws, #drawCount"
    ).forEach(
        input => {
            input.disabled = disabled;
        }
    );

}



/*
==================================================
เริ่มสุ่ม
==================================================
*/

function startDrawing() {

    if (isRunning) {
        return;
    }


    totalDraws =
        parseInt(
            document.getElementById("totalDraws").value
        );


    drawCount =
        parseInt(
            document.getElementById("drawCount").value
        );


    const labelConfiguration =
        readLabelConfiguration();


    if (
        labelConfiguration.some(
            item =>
                !Number.isInteger(item.count) ||
                item.count < 0
        )
    ) {

        alert(
            "จำนวนของเลขแต่ละตัวต้องเป็นจำนวนเต็มตั้งแต่ 0 ขึ้นไป"
        );

        return;

    }


    activeLabels = labelConfiguration.flatMap(
        item =>
            Array(item.count).fill(item.number)
    );


    if (activeLabels.length === 0) {

        alert(
            "กรุณากำหนดจำนวนฉลากอย่างน้อย 1 ใบ"
        );

        return;

    }


    /*
        ตรวจสอบจำนวนครั้ง
    */

    if (
        isNaN(totalDraws) ||
        totalDraws < 1
    ) {

        alert(
            "กรุณาระบุจำนวนครั้งที่ต้องการสุ่ม"
        );

        return;

    }


    /*
        ตรวจสอบจำนวนใบ
    */

    if (
        isNaN(drawCount) ||
        drawCount < 1 ||
        drawCount > activeLabels.length
    ) {

        alert(
            `จำนวนใบต่อครั้งต้องอยู่ระหว่าง 1 - ${activeLabels.length} ใบ`
        );

        return;

    }


    /*
        Reset
    */

    currentDraw = 0;

    historyData = [];

    isRunning = true;


    document.getElementById("drawButton")
        .disabled = true;


    setConfigurationDisabled(true);


    document.getElementById("totalDrawDisplay")
        .innerText = totalDraws;


    /*
        สร้าง Header ตาราง
        ตามจำนวนใบที่กำหนด
    */

    createTableHeader();


    /*
        ล้างประวัติเดิม
    */

    document.getElementById("historyBody")
        .innerHTML = "";


    /*
        เริ่มสุ่ม
    */

    drawNext();

}



/*
==================================================
สุ่มครั้งถัดไป
==================================================
*/

function drawNext() {

    if (!isRunning) {
        return;
    }

    /*
        ถ้าสุ่มครบแล้ว
    */

    if (currentDraw >= totalDraws) {

        finishDrawing();

        return;

    }


    currentDraw++;


    document.getElementById("currentDraw")
        .innerText = currentDraw;


    /*
        สำคัญ

        ทุกครั้งสร้างฉลากใหม่

        ดังนั้นแต่ละการสุ่ม
        เป็นรอบใหม่อิสระจากกัน
    */

    let availableLabels =
        [...activeLabels];


    let selected = [];


    /*
        สุ่มตามจำนวนใบ
    */

    for (
        let i = 0;
        i < drawCount;
        i++
    ) {

        const randomIndex =
            Math.floor(
                Math.random() *
                availableLabels.length
            );


        const picked =
            availableLabels.splice(
                randomIndex,
                1
            )[0];


        selected.push(picked);

    }


    /*
        บันทึกประวัติ
    */

    historyData.push({

        draw: currentDraw,

        results: selected

    });


    /*
        แสดงผล
    */

    showResults(selected);


    /*
        เพิ่มลงตาราง
    */

    addHistoryRow(
        currentDraw,
        selected
    );


    /*
        สุ่มครั้งต่อไป
    */

    if (currentDraw < totalDraws) {

        setTimeout(
            drawNext,
            1000
        );

    } else {

        finishDrawing();

    }

}



/*
==================================================
สร้าง Header ตาราง
==================================================
*/

function createTableHeader() {

    const header =
        document.getElementById("tableHeader");


    header.innerHTML = "";


    /*
        Column ครั้งที่
    */

    const thDraw =
        document.createElement("th");

    thDraw.innerText =
        "ครั้งที่";

    header.appendChild(thDraw);


    /*
        Column ผลลัพธ์
    */

    for (
        let i = 1;
        i <= drawCount;
        i++
    ) {

        const th =
            document.createElement("th");

        th.innerText =
            `ผลที่ ${i}`;

        header.appendChild(th);

    }


    /*
        จำนวนใบ
    */

    const thCount =
        document.createElement("th");

    thCount.innerText =
        "จำนวนใบ";

    header.appendChild(thCount);

}



/*
==================================================
เพิ่มข้อมูลในตาราง
==================================================
*/

function addHistoryRow(
    drawNumber,
    selected
) {

    const tbody =
        document.getElementById("historyBody");


    const row =
        document.createElement("tr");


    /*
        ครั้งที่
    */

    const drawCell =
        document.createElement("td");

    drawCell.innerText =
        drawNumber;

    row.appendChild(drawCell);


    /*
        ผลลัพธ์แต่ละใบ
    */

    selected.forEach(
        number => {

            const cell =
                document.createElement("td");

            cell.innerText =
                number;

            row.appendChild(cell);

        }
    );


    /*
        จำนวนใบ
    */

    const countCell =
        document.createElement("td");

    countCell.innerText =
        selected.length;

    row.appendChild(countCell);


    tbody.appendChild(row);

}



/*
==================================================
แสดงผลล่าสุด
==================================================
*/

function showResults(selected) {

    const results =
        document.getElementById("results");


    results.innerHTML = "";


    selected.forEach(
        number => {

            const div =
                document.createElement("div");


            div.className =
                "result-number";


            div.innerText =
                number;


            results.appendChild(div);

        }
    );

}



/*
==================================================
สุ่มครบ
==================================================
*/

function finishDrawing() {

    isRunning = false;


    document.getElementById("drawButton")
        .disabled = false;


    setConfigurationDisabled(false);


    document.getElementById("message")
        .innerText =
        `🎉 สุ่มครบ ${totalDraws} ครั้งแล้ว`;

}



/*
==================================================
Export CSV
==================================================
*/

function exportCSV() {

    if (historyData.length === 0) {

        alert(
            "ยังไม่มีประวัติสำหรับ Export"
        );

        return;

    }


    let csv = "";


    /*
        Header
    */

    csv += "ครั้งที่";


    for (
        let i = 1;
        i <= drawCount;
        i++
    ) {

        csv += `,ผลที่ ${i}`;

    }


    csv += ",จำนวนใบ\n";


    /*
        Data
    */

    historyData.forEach(
        item => {

            csv += item.draw;


            item.results.forEach(
                number => {

                    csv += `,${number}`;

                }
            );


            csv += `,${item.results.length}\n`;

        }
    );


    /*
        เพิ่ม BOM

        เพื่อให้ Excel ภาษาไทย
        ไม่กลายเป็นภาษาต่างดาว
    */

    const BOM =
        "\uFEFF";


    const blob =
        new Blob(
            [
                BOM + csv
            ],
            {
                type:
                    "text/csv;charset=utf-8;"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    link.href = url;


    link.download =
        `ผลการสุ่ม_${getFileDate()}.csv`;


    link.click();


    URL.revokeObjectURL(url);

}



/*
==================================================
Export Excel
==================================================
*/

function exportExcel() {

    if (historyData.length === 0) {

        alert(
            "ยังไม่มีประวัติสำหรับ Export"
        );

        return;

    }


    /*
        เตรียมข้อมูล
    */

    let excelData = [];


    /*
        Header
    */

    let header = [
        "ครั้งที่"
    ];


    for (
        let i = 1;
        i <= drawCount;
        i++
    ) {

        header.push(
            `ผลที่ ${i}`
        );

    }


    header.push(
        "จำนวนใบ"
    );


    excelData.push(header);


    /*
        Data
    */

    historyData.forEach(
        item => {

            let row = [
                item.draw
            ];


            item.results.forEach(
                number => {

                    row.push(number);

                }
            );


            row.push(
                item.results.length
            );


            excelData.push(row);

        }
    );


    /*
        สร้าง Excel
    */

    const worksheet =
        XLSX.utils.aoa_to_sheet(
            excelData
        );


    const workbook =
        XLSX.utils.book_new();


    XLSX.utils.book_append_sheet(
        workbook,
        worksheet,
        "ผลการสุ่ม"
    );


    /*
        Download
    */

    XLSX.writeFile(
        workbook,
        `ผลการสุ่ม_${getFileDate()}.xlsx`
    );

}



/*
==================================================
Copy สำหรับ Excel
==================================================

สร้างข้อมูลแบบ TAB

เมื่อ Paste ลง Excel
จะถูกแยก Column อัตโนมัติ
==================================================
*/

function copyToExcel() {

    if (historyData.length === 0) {

        alert(
            "ยังไม่มีประวัติสำหรับ Copy"
        );

        return;

    }


    let text = "";


    /*
        Header
    */

    text += "ครั้งที่\t";


    for (
        let i = 1;
        i <= drawCount;
        i++
    ) {

        text += `ผลที่ ${i}\t`;

    }


    text += "จำนวนใบ\n";


    /*
        Data
    */

    historyData.forEach(
        item => {

            text +=
                item.draw + "\t";


            item.results.forEach(
                number => {

                    text +=
                        number + "\t";

                }
            );


            text +=
                item.results.length;


            text += "\n";

        }
    );


    /*
        Copy เข้า Clipboard
    */

    navigator.clipboard.writeText(
        text
    )
    .then(
        () => {

            document.getElementById("message")
                .innerText =
                "✅ Copy ข้อมูลเรียบร้อยแล้ว สามารถ Paste ลง Excel ได้เลย";

        }
    )
    .catch(
        () => {

            /*
                กรณี Browser ไม่อนุญาต
            */

            const textarea =
                document.createElement("textarea");

            textarea.value = text;

            document.body.appendChild(
                textarea
            );

            textarea.select();

            document.execCommand(
                "copy"
            );

            document.body.removeChild(
                textarea
            );


            document.getElementById("message")
                .innerText =
                "✅ Copy ข้อมูลเรียบร้อยแล้ว";

        }
    );

}

function resetGame() {

    currentDraw = 0;

    historyData = [];


    /*
        เปิดปุ่ม
    */

    document.getElementById("drawButton")
        .disabled = false;


    setConfigurationDisabled(false);


    /*
        Counter
    */

    document.getElementById("currentDraw")
        .innerText = "0";


    /*

    */

    document.getElementById("results")
        .innerHTML =

        `<div class="empty">
            กดปุ่ม "เริ่มสุ่ม"
        </div>`;


    /*
        ตาราง
    */

    document.getElementById("historyBody")
        .innerHTML = "";


    /*
        Message
    */

    document.getElementById("message")
        .innerText = "";

}



/*
==================================================
วันที่สำหรับชื่อไฟล์
==================================================
*/

function getFileDate() {

    const now =
        new Date();


    const year =
        now.getFullYear();


    const month =
        String(
            now.getMonth() + 1
        ).padStart(2, "0");


    const day =
        String(
            now.getDate()
        ).padStart(2, "0");


    const hour =
        String(
            now.getHours()
        ).padStart(2, "0");


    const minute =
        String(
            now.getMinutes()
        ).padStart(2, "0");


    const second =
        String(
            now.getSeconds()
        ).padStart(2, "0");


    return (
        `${year}${month}${day}_` +
        `${hour}${minute}${second}`
    );

}
